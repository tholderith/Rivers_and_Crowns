<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rivers &amp; Crowns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
</head>
<body>
  <div id="game">
    <header class="topbar">
      <div class="herocard" id="hero0"></div>
      <div class="roundbox"><div class="title">Rivers &amp; Crowns</div><div id="round">Round 1</div></div>
      <div class="herocard right" id="hero1"></div>
    </header>
    <main class="field"><div id="stage"></div><div class="tip" id="tip" hidden></div></main>
    <footer class="hud">
      <div class="queue" id="queue" aria-label="Turn order"></div>
      <div class="controls">
        <div class="actions" id="actions"></div>
        <div class="abilities" id="abilities"></div>
      </div>
      <div class="panel">
        <div class="info" id="info"></div>
        <ol class="log" id="log"></ol>
      </div>
    </footer>
  </div>
  <div id="map" hidden>
    <header class="topbar mapbar">
      <div class="mapres" id="mapres"></div>
      <div class="roundbox"><div class="title">Rivers &amp; Crowns</div><div id="mapday"></div></div>
      <div class="maphelp">Click a tile to plan a route, click it again to march. Drag, scroll or use the arrow keys to look around; pinch or Ctrl+scroll to zoom.</div>
    </header>
    <div class="mapwrap">
      <main class="field"><div id="mapstage"></div><div class="tip" id="maptip" hidden></div>
        <div class="mapctl"><button class="btn" id="zIn" aria-label="Zoom in">+</button><button class="btn" id="zOut" aria-label="Zoom out">−</button><button class="btn" id="zHome" aria-label="Find my hero">⌖ Hero</button></div></main>
      <aside class="side"><canvas id="minimap" width="252" height="164" aria-label="Minimap: click to move the view"></canvas><div id="side"></div></aside>
    </div>
    <div class="screen" id="recruit" hidden></div>
    <div class="screen" id="pass" hidden></div>
  </div>
  <div class="screen" id="start"></div>
  <div class="screen" id="end" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
